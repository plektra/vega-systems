# Vegan hydrauliikan kuormarekisteri
#
# Kuormakohtaisten lukujen ensisijainen lähde. Taustat ja käyttötilanteet: requirements.md.
# Avaimet (kenttien nimet) ovat englanniksi, koska laskentaskriptit lukevat niitä; yksiköt ovat
# avaimen nimessä. Tuntematon arvo = null. Pidä tiedosto validina YAML:na.
#
# Kenttien selitykset
#   in_scope:     true | false | null (ei päätetty)
#   criticality:  critical | high | medium | low
#   actuator:     cylinder | motor | rotary_actuator
#   cylinder:     lineaaritoimilaitteen voima ja isku
#   motor:        pyörivän toimilaitteen momentti ja nopeus
#   duty:         kuinka kauan ja kuinka usein kuorma on käytössä
#   control:      on_off | proportional | autopilot
#   fail_state:   vaadittu toiminta tehon tai hydrauliikan menetyksessä
#   source:       mistä luvut ovat peräisin (datalehti, laskelma, arvio)

schema_version: 1

loads:
  - id: STR
    name: Ohjaus / autopilotti
    in_scope: true
    existing: Orbitroli HKUS 160/4 (158.4 cm3/r) + kaksitoiminen sylinteri ZS60350100; normaali paine < 50 bar
    criticality: critical
    actuator: cylinder
    cylinder:
      max_force_kN: null           # peräsimen suurin momentti / ohjausvarren pituus
      stroke_mm: 100               # ZS60350100: männän Ø 60, varren Ø 35 [omistaja 2026-10-23]
      tiller_arm_mm: null
      hard_over_time_s: null       # ääriasennosta toiseen
    duty:
      continuous: true
      run_time_min: null
      cycles_per_hour: null
    control: autopilot
    fail_state: pitää asennon; käsi- tai hätäohjaus käytettävissä
    source: null
    notes: "Autopilotti mahdollinen: ohjaa sylinteriä solenoidiventtiilillä ohjauspiirissä, ei omaa pumppua [omistaja 2026-10-25]. Kytkentäehdotus requirements.md 10.3."

  - id: BTH
    name: Keulapotkuri
    in_scope: true
    existing: Side-Power SH240/250TC-U11, 250 mm tunneli, kaksi vastakkain pyörivää potkuria; BAV-713 4/3 on/off-venttiili
    criticality: high
    actuator: motor
    motor:
      thrust_kN: 2.35              # 240 kg kevyt käyttö; raskas käyttö 220 kg (asennusohje 2025)
      max_torque_Nm: null
      max_speed_rpm: null
      power_kW: 14.9               # hydraulinen, 264 bar x 33,8 l/min
      pressure_bar: 264            # 100 % teho
      flow_L_per_min: 33.8         # 100 % teho
      pressure_60pct_bar: 158
      flow_60pct_L_per_min: 26.2
      pressure_80pct_bar: 211
      flow_80pct_L_per_min: 30.2
    duty:
      continuous: true             # asennusohje: "Maximum Operation Time: Continuous"
      run_time_min: null           # ei rajaa; käytännön raja öljyn lämpötila
      cycles_per_hour: null
    control: on_off                # nykyinen venttiili on on/off; proportionaalinen on mahdollinen
    fail_state: pysähtyy, moottori pyörii vapaasti (A-B-T-vapaakierto)
    design_pressure_bar: 250       # päätetty: ~90 % työntövoima hyväksytty, 250 barin komponentit
    source: Sleipner asennusohje 2746 35 2025; Side-Power SH Series product specification v1.0.0 2017
    notes: "Hihnavedolla saavutettiin vain ~160-170 bar; se riitti kääntämään aluksen laiturissa. Potkuri on niin syvällä, ettei se koskaan saa ilmaa lapoihin [omistaja 2026-10-26] -> ylikierrossuojaa ei tarvita."

  - id: WLS
    name: Ankkurivinssi
    in_scope: true                 # vahvistamatta
    existing: ei kytketty; ketjuveto kahdella ketjulla ja käsikäyttöinen hihna-/kitkajarru (nauhajarru) ketjupyörän akselilla; sähkömoottori (tukilaakeriyksikön kautta, suoraveto tai planeettavaihde, ei varmaa) korvataan hydraulimoottorilla, ketjuveto säilytetään; moottoriksi selvitetään ylimääräiseksi jäänyt hydraulimoottori, malli ei tiedossa [omistaja 2026-10-27]
    criticality: high
    actuator: motor
    motor:
      working_pull_kN: null
      max_pull_kN: null
      line_speed_m_per_min: null
      gypsy_diameter_mm: null
      max_torque_Nm: null
      max_speed_rpm: null
    duty:
      continuous: false
      run_time_min: null
      cycles_per_hour: null
    control: on_off
    fail_state: pitää kuorman (jarruventtiili moottorilla, kunnes käsikäyttöinen nauhajarru kiristetään; nauhajarru pitää myös vetoketjun katkettua)
    source: omistaja 2026-10-27
    notes: "Omistajien listalla mahdollisena apupiirin kuormana [omistaja 2026-10-25]; CETOP-pohjalaatan vapaa paikka."

  - id: PWW
    name: Painepesuri
    in_scope: null                 # mahdollinen [omistaja 2026-10-25]; laitetta ei valittu
    criticality: low
    actuator: motor
    motor:
      pressure_bar: null           # hydraulimoottorin käyttöpaine
      flow_L_per_min: null         # hydraulimoottorin tarve; apupiiri antaa enintään noin 34 l/min
      power_kW: null
      water_pressure_bar: null     # pesurin vedenpaine
      water_flow_L_per_min: null
    duty:
      continuous: true             # pesu kestää pitkään -> öljyn lämpö ratkaisee (oil-cooling.md)
      run_time_min: null
      cycles_per_hour: null
    control: on_off
    fail_state: pysähtyy
    source: null
    notes: "Mahdollinen apupiirin kuorma [omistaja 2026-10-25]. Käytetään satamassa tyhjäkäynnillä; CETOP-pohjalaatan vapaa paikka."

  - id: DAV
    name: Nosturi / jollan daavitti
    in_scope: null                 # epätodennäköinen [omistaja 2026-10-25]
    criticality: medium
    actuator: cylinder
    cylinder:
      max_force_kN: null
      stroke_mm: null
      speed_mm_per_s: null
    duty:
      continuous: false
      run_time_min: null
      cycles_per_hour: null
    control: proportional
    fail_state: pitää kuorman (kuormanpitoventtiilit)
    source: null
    notes: ""
