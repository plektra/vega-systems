# Vegan sähkökuormien rekisteri: AC (230 V, loads) ja DC (24 V, dc_loads)
#
# Kuormakohtaisten lukujen ensisijainen lähde. Taustat ja laskelmat: design/ac-power-source.md.
# Avaimet ovat englanniksi; yksiköt ovat avaimen nimessä. Tuntematon arvo = null. Pidä tiedosto
# validina YAML:na.
#
# Kenttien selitykset
#   power_W:          omistajan tai datalehden ilmoittama teho (null = ei tiedossa)
#   power_W_estimate: tyypillinen teho, kun omaa arvoa ei ole (arvio, ei mitattu)
#   use_h_per_day:    arvioitu käyttöaika ankkurivuorokaudessa täydellä teholla
#   location:         sijainti veneessä (DC-kuormat)
#   at_anchor:        käytetäänkö ankkurissa akustolta tai generaattorilta
#   status:           existing (olemassa) | decided (päätetty, ei vielä asennettu) |
#                     planned (suunniteltu, laitetta ei valittu) | candidate (harkinnassa)
#   source:           mistä luvut ovat peräisin

schema_version: 1

# Vain jääkaappi on olemassa [omistaja 2026-10-28]; sähkökiuas on päätetty [omistaja 2026-10-29].
# Muut ovat harkinnassa eikä niiden asentamisesta ole päätetty.

loads:
  - id: SAUNA
    name: Sähkökiuas
    status: decided                # päätetty 2026-10-29; puukiuas ei mahdu [omistaja 2026-10-29]
    power_W: 2300
    use_h_per_day: 2               # kerrallaan noin 2 h; täysi teho koko ajan on yläraja
    energy_kWh_per_session_estimate: 3.7  # termostaatti katkoo [omistaja 2026-10-29]; arvio: 1 h täysi + 1 h ~60 %
    at_anchor: true
    source: "[omistaja 2026-10-28]; kulutusarvio [laskelma]"

  - id: WATER_HEATER
    name: Vedenlämmittimen sähkövastus
    status: candidate
    power_W: 3000
    use_h_per_day: null
    at_anchor: null                # suositus: ei akustolta, ks. design/ac-power-source.md
    source: "[omistaja 2026-10-28]"
    notes: "Onko vedenlämmittimessä lisäksi koneen jäähdytysvesikierukka? ⚠ ei tiedossa"

  - id: FRIDGE
    name: Jääkaappi, noin 130 l ja pakastelokero
    status: existing
    power_W: null
    power_W_estimate: 100          # käydessä; termostaatti katkoo
    energy_kWh_per_day_estimate: 0.8
    at_anchor: true
    source: "[omistaja 2026-10-28]; teho ja kulutus arvio"

  - id: STOVE
    name: Liesi
    status: candidate
    power_W: null
    power_W_estimate: 3000         # kaikki levyt päällä; levyjen määrä ⚠ ei tiedossa
    combined_with_oven_max_W: 3000 # liesi ja uuni yhdessä enintään noin 3 kW [omistaja 2026-10-28]
    use_h_per_day: 0.5             # vastaa noin 1 h keskimäärin puolella teholla
    at_anchor: true
    source: "[omistaja 2026-10-28]; teho arvio"

  - id: OVEN
    name: Uuni
    status: candidate
    power_W: null
    power_W_estimate: 2000
    use_h_per_day: 0.5
    at_anchor: true
    source: "[omistaja 2026-10-28]; teho arvio"

  - id: KETTLE
    name: Vedenkeitin
    status: candidate
    power_W: null
    power_W_estimate: 2000
    use_h_per_day: 0.1
    at_anchor: true
    source: "[omistaja 2026-10-28]; teho arvio"

  - id: COFFEE
    name: Kahvinkeitin
    status: candidate
    power_W: null
    power_W_estimate: 1000
    use_h_per_day: 0.25
    at_anchor: true
    source: "[omistaja 2026-10-28]; teho arvio"

  - id: HOOD
    name: Liesituuletin
    status: candidate
    power_W: null
    power_W_estimate: 100
    use_h_per_day: 1
    at_anchor: true
    source: "[omistaja 2026-10-28]; teho arvio"

  - id: EXHAUST_FAN
    name: Poistoilmapuhallin
    status: candidate
    power_W: null
    power_W_estimate: 40
    use_h_per_day: null
    at_anchor: true
    source: "[omistaja 2026-10-28]; teho arvio"

  - id: HRV
    name: Ilmanvaihtokone
    status: candidate
    power_W: null
    power_W_estimate: 50
    use_h_per_day: 24
    at_anchor: true
    source: "[omistaja 2026-10-28]; teho arvio"

  - id: TV
    name: Televisio
    status: candidate
    power_W: null
    power_W_estimate: 80
    use_h_per_day: 3
    at_anchor: true
    source: "[omistaja 2026-10-28]; teho arvio"

  - id: CHARGERS
    name: Laturit (kannettava tietokone ym.)
    status: candidate
    power_W: null
    power_W_estimate: 100
    use_h_per_day: 3
    at_anchor: true
    source: "[omistaja 2026-10-28]; teho arvio"

  - id: OIL_BURNER
    name: Öljykäyttöisen lämmityslaitteen poltin
    status: candidate
    power_W: null
    current_A_max: 1               # alle 1 A, 230 V → alle 230 W
    power_W_estimate: 200
    use_h_per_day: 6               # lämmityskaudella; arvio
    at_anchor: true
    source: "[omistaja 2026-10-28]; käyttöaika arvio"

  - id: INCINERATING_TOILET
    name: Jätteet polttava WC
    status: candidate              # [omistaja 2026-10-29]
    power_W: null                  # ⚠ ei tiedossa; malli valitsematta
    energy_kWh_per_use: null       # ⚠ ei tiedossa; polttava WC kuluttaa tyypillisesti noin 1–2 kWh käyntikerralta (arvio, tarkista valitun mallin datalehdestä)
    use_h_per_day: null
    at_anchor: true
    source: "[omistaja 2026-10-29]"

# 24 V:n DC-kuormat konehuoneessa [omistaja 2026-10-29]. Olemassa ovat LED-nauhavalaistus,
# polttoaineen siirtopumppu, Raspberry Pi 5 (Signal K), Intel NUC (Frigate) ja 4G-modeemi; muut ovat suunniteltuja, eikä laitteita ole valittu. Tehot ovat tyypillisten 24 V:n
# laitteiden arvioita, ei mitattuja; korvaa ne valittujen laitteiden datalehtien arvoilla.
# Hydrauliikan varapumppu P3 (2,5 kW) on kuvattu tiedostossa current-system.md (kohta 3).

dc_loads:
  - id: ER_CAMERA
    name: Konehuoneen valvontakamera
    location: konehuone
    status: planned
    voltage_V: 24
    power_W: null
    power_W_estimate: 5
    use_h_per_day: 24              # oletus: päällä aina, myös ankkurissa
    source: "[omistaja 2026-10-29]; teho ja käyttöaika arvio"

  - id: FUEL_TRANSFER_PUMP
    name: Polttoaineen siirtopumppu
    location: konehuone
    status: existing
    voltage_V: 24
    power_W: null                  # ⚠ tarkista tyyppikilvestä
    power_W_estimate: 100
    use_h_per_day: null            # vain siirrot bunkkereista päivätankkiin ja pesukierto; ei ankkurikuorma
    source: "[omistaja 2026-10-29]; teho arvio"
    notes: "Polttoainejärjestelmä on keskeneräinen; bunkkereita ei tällä hetkellä ole [omistaja 2026-10-29]"

  - id: GREY_WATER_PUMP
    name: Harmaavesisumpun pumppu
    location: konehuone
    status: planned
    voltage_V: 24
    power_W: null
    power_W_estimate: 120
    use_h_per_day: 0.2             # uimurikytkimellä; arvio
    source: "[omistaja 2026-10-29]; teho ja käyttöaika arvio"

  - id: FUME_EXTRACT_FAN
    name: Savukaasujen poistopuhallin (esim. hitsauskaasut), tilapäinen käyttö
    location: konehuone
    status: planned
    voltage_V: 24
    power_W: null
    power_W_estimate: 50
    use_h_per_day: 0               # vain tilapäisesti töiden aikana, ei ankkurikuorma [omistaja 2026-10-29]
    source: "[omistaja 2026-10-29]; teho arvio"

  - id: FRESH_WATER_PUMP
    name: Käyttövesipumppu (painevesi)
    location: konehuone
    status: planned
    voltage_V: 24
    power_W: null
    power_W_estimate: 150
    use_h_per_day: 0.3             # arvio
    source: "[omistaja 2026-10-29]; teho ja käyttöaika arvio"

  - id: HEATING_CIRC_PUMP
    name: Vesikiertoisen lämmityksen kiertovesipumppu
    location: konehuone
    status: planned
    voltage_V: 24
    power_W: null
    power_W_estimate: 30
    use_h_per_day: 24              # lämmityskaudella; arvio
    source: "[omistaja 2026-10-29]; teho ja käyttöaika arvio"

  - id: ER_LIGHTING
    name: Konehuoneen yleisvalaistus, LED-nauhat
    location: konehuone
    status: existing
    voltage_V: 24
    power_W: null                  # ⚠ tarkista: nauhojen pituus ja W/m
    power_W_estimate: 50
    use_h_per_day: 1               # arvio
    source: "[omistaja 2026-10-29]; teho ja käyttöaika arvio"

  - id: SIGNALK_PI
    name: Raspberry Pi 5, Signal K -palvelin
    location: konehuone
    status: existing
    voltage_V: 24                  # Mean Well DDR-15G-5: 24 V → 5 V, 3 A (15 W), hyötysuhde 84 % [omistaja 2026-10-29]
    power_W: null
    power_W_estimate: 8            # akustosta muuntimen häviöineen; Pi 5 noin 7 W, muunnin rajaa enintään 15 W:iin
    use_h_per_day: 24
    source: "[omistaja 2026-10-29]; teho arvio"
    notes: "Voidaan konsolidoida NUC:n kanssa; elektroniikka suunnitellaan erikseen [omistaja 2026-10-29]"

  - id: FRIGATE_NUC
    name: Intel NUC, Frigate (kameratallennin)
    location: konehuone
    status: existing
    voltage_V: 24                  # Mean Well DDR-240B-24: 24 V → 24 V, 10 A (240 W), hyötysuhde noin 90 %; syöttää myös NMEA 2000 -väylän [omistaja 2026-10-29]
    power_W: null
    power_W_estimate: 17           # akustosta muuntimen häviöineen; NUC noin 15 W, malli ⚠ ei tiedossa
    use_h_per_day: 24
    source: "[omistaja 2026-10-29]; teho arvio"
    notes: "Voidaan konsolidoida Raspberry Pi 5:n kanssa; elektroniikka suunnitellaan erikseen [omistaja 2026-10-29]"

  - id: MODEM_4G
    name: 4G-modeemi Teltonika RUT240
    location: null                 # ⚠ ei tiedossa
    status: existing
    voltage_V: 24                  # tulo 9–30 VDC [datalehti Teltonika RUT240]
    power_W: null
    power_W_estimate: 2            # Teltonikan mittaus 24 V:lla: tyhjäkäynti noin 0,9 W, yksi LAN-laite ja mobiilidata noin 1,5 W, täysi kuorma noin 4,2 W
    use_h_per_day: 24
    source: "[omistaja 2026-10-29]; teho [datalehti Teltonika RUT240 Power Consumption], käyttöteho arvio"
    notes: "Syöttö Mean Well DDR-240B-24:n vakautetusta 24 V:sta [omistaja 2026-10-29]"

  - id: BILGE_PUMPS
    name: Pilssipumput, 3 kpl, kohokytkimillä
    location: null                 # ⚠ ei tiedossa
    status: existing
    quantity: 3
    voltage_V: 24
    current_A_each: 12             # täydellä teholla; omistajan muistikuva ⚠ tarkista tyyppikilvestä
    power_W_each: 288              # 24 V × 12 A [laskelma]
    use_h_per_day: null            # käy vain kohokytkimen ohjaamana; normaalisti lähes nolla
    source: "[omistaja 2026-10-29]"
    notes: "Turvallisuuskriittinen: syöttö suoraan akulta pääkytkimen ohi omalla sulakkeella; ei saa jäädä alijännitekatkaisun taakse"

  - id: HYD_CONTROL
    name: Hydrauliikan ohjaus (PDM, PVE-ohjausyksiköt, BAV-713:n kelat, anturit)
    location: konehuone
    status: planned
    voltage_V: 24
    power_W: null                  # ⚠ ei tiedossa; tarkista PVE:n ja kelojen datalehdistä
    use_h_per_day: null            # vain hydrauliikkaa käytettäessä
    source: "[omistaja 2026-10-29]; ks. hydraulics/schematic.md (2A1)"

