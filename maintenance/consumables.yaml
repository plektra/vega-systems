# Vegan kulutus- ja vaihto-osat
#
# Kaikkien järjestelmien kuluvat ja määräajoin vaihdettavat osat, nesteet ja tarkistukset.
# Tämä tiedosto on ensisijainen lähde. Taulukko README.md tehdään tästä komennolla
#   python3 maintenance/render.py
# Älä muokkaa README.md:n taulukkoa käsin.
#
# Avaimet ovat englanniksi, arvot suomeksi. Desimaalierotin YAML-arvoissa on piste (25.5).
# Tuntematon arvo = null. Pidä tiedosto validina YAML:na.
#
# Kenttien selitykset
#   id:              pysyvä tunniste (JÄRJESTELMÄ-KOHDE), ei muutu
#   system:          engine | gearbox | hydraulics | bow_thruster | electrics | hull | anchor_winch | heating
#   action:          replace (vaihto) | inspect (tarkistus) | spare (varaosa, vaihdetaan rikkoutuessa)
#   name:            mikä osa tai neste
#   product:         tuote, malli tai laatuluokka
#   part_number:     osanumero (null, jos ei tiedossa)
#   size:            mitat tai koko vapaana tekstinä (esim. hihnan profiili ja pituus)
#   quantity:        kappalemäärä vapaana tekstinä (esim. "2 kpl, vaihdetaan parina")
#   volume_l:        nesteen määrä litroina
#   interval_h:      vaihtoväli koneen käyttötunteina (null = ei tunteihin sidottu tai ei tiedossa)
#   interval_months: vaihtoväli kuukausina; kumpi täyttyy ensin
#   due_note:        vapaa teksti seuraavasta ajankohdasta, jos sitä ei voi laskea väleistä
#                    (esim. "käyttöönoton koeajojen jälkeen"); näytetään laskelman sijaan, jos
#                    historiaa ei ole
#   onboard_spares:  montako varalla veneessä
#   history:         tehdyt vaihdot, UUSIN ENSIN: date (VVVV-KK-PP), engine_h (tuntimittari), note, source
#   notes:           muuta
#   source:          lähteet CLAUDE.md:n merkinnöin

schema_version: 1

